name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: grammar and tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tree-sitter grammar and highlight queries
        run: ./scripts/check-grammar.sh
      - name: Tool discovery and petcat smoke test
        run: ./scripts/test-tools.sh
